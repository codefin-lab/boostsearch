name: release

# A release is cut by pushing a tag. Everything here is built from that tag
# and nothing else, so what is published is what the tag says.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'the tag to build, for a dry run'
        required: true

permissions:
  contents: write
  packages: write

jobs:
  # The gates run again on the tag. A release that was not measured is not a
  # release: the tag may not be the commit the last green run was on.
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.98.0'
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --release --all-targets -- -D warnings
      - run: cargo test --release

  binaries:
    needs: gates
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.98.0'
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      # Two builds a release: one carrying the Japanese, Korean and Chinese
      # dictionaries and one without them. They are most of the binary's
      # weight, and a deployment that does not read those scripts should not
      # have to carry them. Each goes to a target directory of its own, so
      # neither can be packaged as the other.
      - name: Build
        run: |
          cargo build --release --bin boostsearch \
            --target ${{ matrix.target }} --target-dir target/full
          cargo build --release --bin boostsearch --no-default-features \
            --target ${{ matrix.target }} --target-dir target/light
      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          package() {
            name="boostsearch-${version}-${{ matrix.target }}$2"
            mkdir -p "dist/$name"
            cp "target/$1/${{ matrix.target }}/release/boostsearch" "dist/$name/"
            cp README.md LICENSE-APACHE LICENSE-MIT LICENSE-SNOWBALL "dist/$name/"
            tar -C dist -czf "dist/$name.tar.gz" "$name"
            (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
          }
          package full ""
          package light "-nodict"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz*

  image:
    needs: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  publish:
    needs: [binaries, image]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Draft the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # A draft rather than a published release: somebody reads the notes and
        # the checksums before anybody can download them.
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md \
            dist/*.tar.gz dist/*.sha256
