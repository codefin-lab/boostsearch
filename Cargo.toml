[package]
name = "obsearch"
version = "0.1.0"
edition = "2024"

[lib]
name = "obsearch"
path = "src/lib.rs"

[[bin]]
name = "obsearch"
path = "src/main.rs"

[dependencies]
# BoostCore is the search library this is built on: a fork of tantivy kept in
# `vendor/boostcore`, so it can be patched where the engine needs it to behave
# the way OpenSearch does. See docs/boostcore.md.
boostcore = { path = "vendor/boostcore" }
tokio = { version = "1", features = ["full"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
parking_lot = "0.12"
regex = "1"
rayon = "1"
libc = "0.2"
mimalloc = { version = "0.1", default-features = false }
libmimalloc-sys = { version = "0.1", features = ["extended"] }
boostcore-fst = { package = "tantivy-fst", version = "0.5" }
boostcore-common = { path = "vendor/boostcore/common" }

[profile.release]
opt-level = 3
lto = "thin"
