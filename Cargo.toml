[package]
name = "boostsearch"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "An OpenSearch-compatible search server, on BoostCore"
repository = "https://github.com/codefin-lab/boostsearch"
readme = "README.md"
keywords = ["search", "opensearch", "elasticsearch", "server"]
categories = ["database-implementations"]

[lib]
name = "boostsearch"
path = "src/lib.rs"

[[bin]]
name = "boostsearch"
path = "src/main.rs"

[dependencies]
# BoostCore is the search library this is built on: a fork of tantivy that
# lives at github.com/codefin-lab/boostcore, so it can be patched where the
# engine needs it to behave the way OpenSearch does. Pinned to a commit, so a
# build is the same build tomorrow. See docs/boostcore.md.
#
# To work on the fork and this together, clone it beside this repo and add:
#
#     [patch."https://github.com/codefin-lab/boostcore"]
#     boostcore = { path = "../boostcore" }
#     boostcore-common = { path = "../boostcore/common" }
boostcore = { git = "https://github.com/codefin-lab/boostcore", rev = "c5570a884d53aaeed82094a77171d03833b370c8" }
tokio = { version = "1", features = ["full"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
parking_lot = "0.12"
regex = "1"
rayon = "1"
libc = "0.2"
mimalloc = { version = "0.1", default-features = false }
libmimalloc-sys = { version = "0.1", features = ["extended"] }
boostcore-fst = { package = "tantivy-fst", version = "0.5" }
boostcore-common = { git = "https://github.com/codefin-lab/boostcore", rev = "c5570a884d53aaeed82094a77171d03833b370c8" }

[profile.release]
opt-level = 3
lto = "thin"

