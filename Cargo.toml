[package]
name = "obsearch"
version = "0.1.0"
edition = "2024"

[lib]
name = "obsearch"
path = "src/lib.rs"

[[bin]]
name = "obsearch"
path = "src/main.rs"

[dependencies]
tantivy = "0.26"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
parking_lot = "0.12"
regex = "1"
rayon = "1"
tantivy-fst = "0.5"
tantivy-common = "0.11"

[profile.release]
opt-level = 3
lto = "thin"
