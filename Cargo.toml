[package]
name = "boostsearch"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "An OpenSearch-compatible search server, on BoostCore"
repository = "https://github.com/codefin-lab/boostsearch"
readme = "README.md"
keywords = ["search", "opensearch", "elasticsearch", "server"]
categories = ["database-implementations"]

[lib]
name = "boostsearch"
path = "src/lib.rs"

[[bin]]
name = "boostsearch"
path = "src/main.rs"

[dependencies]
# BoostCore is the search library this is built on: a fork of tantivy that
# lives at github.com/codefin-lab/boostcore, so it can be patched where the
# engine needs it to behave the way OpenSearch does. Pinned to a commit, so a
# build is the same build tomorrow. See docs/boostcore.md.
#
# To work on the fork and this together, clone it beside this repo and add:
#
#     [patch."https://github.com/codefin-lab/boostcore"]
#     boostcore = { path = "../boostcore" }
#     boostcore-common = { path = "../boostcore/common" }
boostcore = { git = "https://github.com/codefin-lab/boostcore", rev = "08e39fc28e00523cb195256bf8963ba2dbaf53d2" }
tokio = { version = "1", features = ["full"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
parking_lot = "0.12"
regex = "1"
sha1 = "0.10"
flate2 = "1"
base64 = "0.22"
serde_yaml = "0.9"
bcrypt = "0.15"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2"
rcgen = "0.13"
x509-parser = "0.16"
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto", "service"] }
hyper = { version = "1", features = ["server", "http1", "http2"] }
tower = { version = "0.5", features = ["util"] }
fancy-regex = "0.13"
md5 = "0.7"
sha3 = "0.10"
percent-encoding = "2"
sha2 = "0.10"
rayon = "1"
libc = "0.2"
mimalloc = { version = "0.1", default-features = false }
libmimalloc-sys = { version = "0.1", features = ["extended"] }
boostcore-fst = { package = "tantivy-fst", version = "0.5" }
boostcore-common = { git = "https://github.com/codefin-lab/boostcore", rev = "08e39fc28e00523cb195256bf8963ba2dbaf53d2" }
icu_normalizer = "2.3.0"
icu_segmenter = { version = "2.3.0", features = ["auto"] }
icu_properties = "2.3.0"
# The Japanese, Korean and Chinese dictionaries are built into the binary, the
# way OpenSearch's kuromoji, nori and smartcn plugins carry theirs. They are
# most of what this binary weighs; a build with `--no-default-features` leaves
# them out, and those three analyzers with them.
lindera = { version = "6.0.0", features = [
    "embed-ipadic",
    "embed-ko-dic",
    "embed-cc-cedict",
], optional = true }
jsonwebtoken = "9"
ldap3 = { version = "0.12.1", default-features = false, features = ["tls-rustls-ring"] }
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
quick-xml = "0.42.0"
rsa = { version = "0.9", features = ["sha2", "sha1"] }

[features]
default = ["cjk"]
# the dictionaries for the scripts that are read rather than split
cjk = ["dep:lindera"]

[profile.release]
opt-level = 3
lto = "thin"





