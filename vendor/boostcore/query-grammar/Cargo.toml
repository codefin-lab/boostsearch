[package]
name = "boostcore-query-grammar"
version = "0.26.0"
authors = ["Paul Masurel <paul.masurel@gmail.com>"]
license = "MIT"
categories = ["database-implementations", "data-structures"]
description = """Query grammar of BoostCore, a fork of tantivy"""
homepage = "https://github.com/codefin-lab/boostcore"
repository = "https://github.com/codefin-lab/boostcore"
readme = "README.md"
keywords = ["search", "information", "retrieval"]
edition = "2024"

[dependencies]
nom = "7"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
ordered-float = "5.0.0"
fnv = "1.0.7"
